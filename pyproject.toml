[project]
name = "ecoaves-orbitalos"
version = "0.0.0"
description = "ECOAVES OrbitalOS — DataHub terrestre y visor satelital (NASA + Copernicus)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
server = ["fastapi>=0.110", "uvicorn>=0.27", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["core*", "datahub*", "simulators*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
